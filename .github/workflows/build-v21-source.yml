name: Build v21 source recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v21:
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    steps:
      - name: Checkout image factory
        uses: actions/checkout@v4

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          sudo apt-get clean
          df -h

      - name: Install build dependencies and repo
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs \
            gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev \
            libelf-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 \
            libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync TWRP 12.1
        run: |
          mkdir "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"
          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1
          repo sync -c --force-sync --no-clone-bundle --no-tags -j2

      - name: Pin bootable recovery to v20 UI ABI
        run: |
          cd "$GITHUB_WORKSPACE/twrp/bootable/recovery"
          git fetch --depth=1 https://github.com/TeamWin/android_bootable_recovery.git \
            dbed985d1ccb9412fd19171a3ecfb621bb9d0a6b
          git checkout --detach FETCH_HEAD
          echo "Pinned bootable/recovery to:"
          git log -1 --oneline
          test "$(git rev-parse HEAD)" = "dbed985d1ccb9412fd19171a3ecfb621bb9d0a6b"

      - name: Add M127F DXJ3 device tree
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          rm -rf device/samsung/m12
          git clone --depth=1 \
            --branch m12nsxx-user-13-TP1A.220624.014-M127FXXS9DXJ3-release-keys \
            https://github.com/twrpdtgen/android_device_samsung_m12.git \
            device/samsung/m12

          mv device/samsung/m12/omni_m12.mk device/samsung/m12/twrp_m12.mk
          sed -i 's/vendor\/omni\/config\/common.mk/vendor\/twrp\/config\/common.mk/g' \
            device/samsung/m12/twrp_m12.mk
          sed -i 's/PRODUCT_NAME := omni_m12/PRODUCT_NAME := twrp_m12/g' \
            device/samsung/m12/twrp_m12.mk
          sed -i 's/omni_m12.mk/twrp_m12.mk/g; s/omni_m12/twrp_m12/g' \
            device/samsung/m12/AndroidProducts.mk device/samsung/m12/vendorsetup.sh || true

          # The pinned v20-era bootable/recovery uses the older theme selector.
          # Give it the real panel dimensions so Soong can select portrait_hdpi.
          cat >> device/samsung/m12/BoardConfig.mk <<'EOF'
          TARGET_SCREEN_WIDTH := 720
          TARGET_SCREEN_HEIGHT := 1600
          TW_THEME := portrait_hdpi
          EOF

          tail -n 12 device/samsung/m12/BoardConfig.mk

      - name: Install direct-HIDL Keymaster vold base
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          rm -rf system/vold
          git clone --depth=1 --branch twrp-12.1 \
            https://github.com/4accccc/android_system_vold.git system/vold

          curl -fsSL \
            https://raw.githubusercontent.com/TeamWin/android_system_vold/a164ba05c5fef288059774a776b2e6e1119957cf/Decrypt.cpp \
            -o system/vold/Decrypt.cpp

      - name: Apply v21 HAT + legacy scrypt patch
        run: |
          python3 "$GITHUB_WORKSPACE/source/patch_v21.py" "$GITHUB_WORKSPACE/twrp/system/vold"
          python3 "$GITHUB_WORKSPACE/source/fix_v21_vold_native.py" "$GITHUB_WORKSPACE/twrp/system/vold"
          grep -R -n "v21:" "$GITHUB_WORKSPACE/twrp/system/vold" | head -80

      - name: Build patched recovery executable only
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=1
          export CCACHE_EXEC=/usr/bin/ccache
          ccache -M 5G
          source build/envsetup.sh
          lunch twrp_m12-eng
          mka recovery -j2

          REC="out/target/product/m12/recovery/root/system/bin/recovery"
          if [ ! -f "$REC" ]; then
            REC="$(find out/target/product/m12 -type f -path '*/system/bin/recovery' | head -n1)"
          fi
          test -n "$REC"
          test -f "$REC"
          cp "$REC" "$GITHUB_WORKSPACE/recovery-v21"
          file "$GITHUB_WORKSPACE/recovery-v21"
          sha256sum "$GITHUB_WORKSPACE/recovery-v21"

      - name: Reassemble known-good v20
        run: |
          python3 scripts/reassemble_base.py \
            --manifest base/v20/manifest.json \
            --output v20-base.img

      - name: Inject v21 recovery into v20
        run: |
          mkdir -p dist
          python3 scripts/repack_with_recovery.py \
            --base v20-base.img \
            --recovery-bin recovery-v21 \
            --output dist/M127F_DXJ1_TWRP_crypto_test_v21_hat_ce_auth.img
          python3 scripts/verify_bootimg.py \
            dist/M127F_DXJ1_TWRP_crypto_test_v21_hat_ce_auth.img
          sha256sum dist/M127F_DXJ1_TWRP_crypto_test_v21_hat_ce_auth.img \
            | tee dist/SHA256SUMS.txt
          cp recovery-v21 dist/recovery-v21.elf

      - name: Upload v21
        uses: actions/upload-artifact@v4
        with:
          name: M127F-TWRP-v21-source
          path: |
            dist/M127F_DXJ1_TWRP_crypto_test_v21_hat_ce_auth.img
            dist/SHA256SUMS.txt
            dist/recovery-v21.elf
          if-no-files-found: error
          retention-days: 90
